name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release
    uses: ./.github/workflows/test.yml

  release:
    name: Release linux/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$(git rev-parse --short=12 HEAD)"
            echo "source_date_epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build release archive
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
          CGO_ENABLED: "0"
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: |
          archive="slurm-gha_${VERSION}_${GOOS}_${GOARCH}"
          package_dir="staging/${archive}"
          mkdir -p "$package_dir" dist

          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -buildid= -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "${package_dir}/slurm-gha" \
            ./cmd/slurm-gha

          cp README.md "$package_dir/"
          cp examples/config.yaml "${package_dir}/config.example.yaml"
          cp deploy/slurm-gha.service "$package_dir/"
          cp -R docs "$package_dir/"

          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C staging \
            -cf - \
            "$archive" | gzip -n > "dist/${archive}.tar.gz"

          (
            cd dist
            sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
            sha256sum --check "${archive}.tar.gz.sha256"
          )

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
