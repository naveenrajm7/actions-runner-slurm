apiVersion: slurm-gha/v1alpha1

service:
  listenAddress: "0.0.0.0:8443"
  publicUrl: "https://slurm-gha.example.org:8443"
  statePath: "/var/lib/slurm-gha/state.db"
  jitEncryptionKeyFile: "/run/secrets/slurm-gha-jit-key"
  logRoot: "/var/log/slurm-gha/jobs"
  reconcileInterval: "15s"
  tls:
    certificateFile: "/etc/slurm-gha/tls.crt"
    keyFile: "/etc/slurm-gha/tls.key"
    # If set, install this CA in the guest at
    # /etc/slurm-gha/callback-ca.crt for Linux or
    # C:\slurm-gha\callback-ca.cer for Windows.
    caFile: "/etc/slurm-gha/callback-ca.crt"

github:
  configUrl: "https://github.com/example-org"
  app:
    clientId: "Iv1.example"
    installationId: 12345
    privateKeyFile: "/run/secrets/github-app.pem"

slurm:
  baseUrl: "https://slurm-api.example.org"
  apiVersion: "v0.0.42"
  user: "github-ci"
  tokenFile: "/run/secrets/slurm-jwt"
  caFile: "/etc/slurm-gha/cluster-ca.pem"
  requestTimeout: "30s"

scaleSets:
  - name: "slurm-vm-small"
    runnerGroup: "slurm-ci"
    maxRunners: 10
    maxPending: 10
    maxQueueWait: "2h"
    startupTimeout: "10m"
    slurm:
      partition: "vm"
      account: "vm"
      qos: "normal"
      nodes: 1
      tasks: 1
      cpusPerTask: 2
      memory: "2G"
      walltime: "01:00:00"
    execution:
      mode: "vmocs"
      guestOS: "linux"
      # VMoCS template name, passed to srun as --vm-image=base-ubuntu.
      image: "base-ubuntu"
      scratchRoot: "/scratch/github-ci"

  - name: "slurm-windows-navi4"
    runnerGroup: "slurm-ci"
    maxRunners: 1
    maxPending: 1
    maxQueueWait: "15m"
    startupTimeout: "15m"
    slurm:
      partition: "vm"
      account: "vm"
      qos: "normal"
      nodes: 1
      tasks: 1
      cpusPerTask: 8
      memory: "16G"
      # Select a Navi4 host without hard-coding a node name.
      gres: "gpu:gfx1201:1"
      walltime: "00:28:00"
    execution:
      mode: "vmocs"
      guestOS: "windows"
      image: "windows-rocm-10.1-actions-runner"
      scratchRoot: "/scratch/github-ci/windows"
